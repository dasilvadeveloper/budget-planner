<div class="flex w-full h-[calc(100%-100px)] w-100vw mt-[100px]">
  <div class="py-6 w-full h-min xl:px-[5rem] md:px-[5%] sm:px-[21%]">
    <div class="flex justify-between">
      <h2 class="text-3xl font-medium text-(--accent)">Receitas</h2>

      <button matButton="filled" (click)="addIncome()">
        <mat-icon>add</mat-icon>
        Adicionar
      </button>
    </div>

    <div class="flex items-center gap-3 w-full mt-4 bg-white rounded-2xl shadow px-4">
      <mat-form-field appearance="outline" class="w-36 mt-5">
        <mat-label>De</mat-label>
        <input
          matInput
          [matDatepicker]="startPicker"
          [value]="pendingStartDateTime()"
          [max]="pendingEndDateTime()"
          (dateChange)="onStartDateChange($event)"
        />
        <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-36 mt-5">
        <mat-label>Até</mat-label>
        <input
          matInput
          [matDatepicker]="endPicker"
          [value]="pendingEndDateTime()"
          [min]="pendingStartDateTime()"
          (dateChange)="onEndDateChange($event)"
        />
        <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-54 mt-5">
        <mat-label>Estado</mat-label>
        <mat-select
          multiple
          [value]="pendingStatuses()"
          (selectionChange)="onStatusSelectionChange($event)"
        >
          <div class="px-1.5 py-2 w-full select-none" (click)="$event.stopPropagation()">
            <mat-checkbox
              class="w-full"
              [checked]="isAllStatusesSelected()"
              [indeterminate]="isStatusesPartiallySelected()"
              (change)="toggleAllStatuses()"
            >
              Todos
            </mat-checkbox>
          </div>
          @for (status of allStatuses; track status) {
            <mat-option [value]="status">{{ statusLabels[status] }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-54 mt-5">
        <mat-label>Categoria</mat-label>
        <mat-select
          multiple
          [value]="pendingCategories()"
          (selectionChange)="onCategorySelectionChange($event)"
        >
          <div class="px-1.5 py-2 select-none" (click)="$event.stopPropagation()">
            <mat-checkbox
              class="w-full"
              [checked]="isAllCategoriesSelected()"
              [indeterminate]="isCategoriesPartiallySelected()"
              (change)="toggleAllCategories()"
            >
              Todos
            </mat-checkbox>
          </div>
          @for (category of allCategories; track category) {
            <mat-option [value]="category">{{ categoryLabels[category] }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <button
        matButton="outlined"
        class="mt-1"
        [disabled]="isDateRangeInvalid()"
        (click)="applyFilters()"
      >
        Aplicar filtros
      </button>
    </div>

    @if (isDateRangeInvalid()) {
      <p class="text-sm text-red-600 -mt-2 mb-2">
        A data inicial não pode ser posterior à data final.
      </p>
    }

    <app-transactions-table
      [rows]="incomesRows()"
      [tableHeader]="incomesTableHeader"
      [isLoading]="incomesStore.isIncomesLoading()"
      nameColumnLabel="Receita"
      amountColumnLabel="Valor"
      emptyStateLabel="Nenhuma receita encontrada"
      entityLabelPlural="Receitas"
      (primaryAction)="markAsPaid($event)"
      (editRow)="editIncome($event)"
      (deleteRow)="deleteIncome($event)"
    />
  </div>
</div>

<ng-template #loading>
  <mat-spinner diameter="40" class="left-[50%]"></mat-spinner>
</ng-template>
