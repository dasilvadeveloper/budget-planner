<div class="body-wrapper h-screen flex">
  <app-sidebar
    (mouseenter)="toggleSidebar(true)"
    (mouseleave)="toggleSidebar(false)"
    [isSidebardExpanded]="isSidebarExpanded()"
  ></app-sidebar>
  <div
    class="content text-sky-50 flex-1 overflow-x-hidden"
    style="margin-left: 300px; width: calc(100vw - 300px); max-width: 1920px"
  >
    <app-toolbar></app-toolbar>
    <router-outlet></router-outlet>
  </div>
</div>
